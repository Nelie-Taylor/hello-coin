[project]
name = "hello-coin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nghị PC", email = "nghi@huongda.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
hello-coin = "hello_coin:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not network'"
markers = [
    "network: hits a real external API; excluded by default, run with `-m network`",
]
